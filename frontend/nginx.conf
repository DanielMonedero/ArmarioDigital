# nginx config for the Wardrobe SPA.
#
# Serves the static SPA from /usr/share/nginx/html and reverse-proxies the
# backend endpoints. The SPA talks to relative URLs ("/api/...") so the
# backend stays on the internal docker network and the user only exposes
# port 80 (mapped to 8080 by docker-compose).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text responses to shrink the SPA payload.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: send everything that isn't a real file to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets emitted by Vite.
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Backend reverse-proxy. Everything below is forwarded to the backend
    # service over the docker network. Set-Cookie paths are rewritten to
    # "/" so the JSESSIONID is scoped to the whole origin.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_cookie_path  / "/; HttpOnly";
        # Image uploads can be up to 11 MB; bump the proxy buffer too.
        proxy_buffering    off;
        client_max_body_size 16m;
    }

    location /v3/api-docs {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }

    location /actuator {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }
}
